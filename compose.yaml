services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: 3gpp-mcp:0.2.0
    restart: unless-stopped
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${MCP_DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    environment:
      THREEGPP_MCP_BEARER_TOKEN: ${THREEGPP_MCP_BEARER_TOKEN:-}
    stop_grace_period: 75s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
