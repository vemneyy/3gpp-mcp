services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: 3gpp-mcp-etsi:local
    restart: unless-stopped
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${MCP_DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
